[package]
name = "tonic-tls-xds"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["youyuanwu@outlook.com"]
repository = "https://github.com/youyuanwu/tonic-tls"
documentation = "https://docs.rs/tonic-tls-xds"
description = "Certificate providers and reloadable TLS connectors for tonic."
categories = ["web-programming", "network-programming"]
keywords = ["gRPC", "tls", "tonic", "xds"]
readme = "README.md"

[dependencies]
tonic-tls = { version = "0.8.0", path = "../tonic-tls", default-features = false }
tokio = { workspace = true, features = ["fs", "rt", "time"] }
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
futures.workspace = true
tracing.workspace = true
tokio-rustls = { workspace = true, optional = true }

[features]
default = []
rustls = ["dep:tokio-rustls"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tempfile.workspace = true
