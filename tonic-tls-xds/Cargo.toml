[package]
name = "tonic-tls-xds"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["youyuanwu@outlook.com"]
repository = "https://github.com/youyuanwu/tonic-tls"
documentation = "https://docs.rs/tonic-tls-xds"
description = "Certificate providers and reloadable TLS connectors for tonic."
categories = ["web-programming", "network-programming"]
keywords = ["gRPC", "tls", "tonic", "xds"]
readme = "README.md"

[dependencies]
tonic-tls.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "time"] }
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
futures.workspace = true
tracing.workspace = true
tokio-rustls = { workspace = true, optional = true }
webpki = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
openssl-sys = { workspace = true, optional = true }
foreign-types = { workspace = true, optional = true }
pki-types = { workspace = true, features = ["std"], optional = true }

[features]
default = []
rustls = ["dep:tokio-rustls", "dep:webpki"]
openssl = ["dep:openssl", "dep:tokio-openssl", "dep:openssl-sys", "dep:foreign-types", "dep:pki-types"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tempfile.workspace = true
